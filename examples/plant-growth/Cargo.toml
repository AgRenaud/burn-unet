[package]
name = "plant-growth"
version = "0.1.0"
edition = "2024"

[features]
wgpu = ["burn/wgpu"]
cuda = ["burn/cuda"]

[dependencies]
anyhow = "1.0.97"
burn = { version = "0.17.0", features = ["train", "vision", "tui"] }
burn-unet = { version = "0.1.0", path = "../.." }
clap = { version = "4.5.32", features = ["derive"] }
image = { version = "0.25.5", features = ["jpeg", "png", "tiff"] }
thiserror = "2.0.12"
